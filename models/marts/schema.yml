version: 2

models:
  - name: fact_listings
    description: |
      One row per listing per day for the calendar period (2021-07-12 to 2022-07-11), for revenue,
      occupancy and amenity analysis. Amenities are as of each day where changelog history exists,
      otherwise the listing's current amenities.

      Use with care:
      - Sum `revenue`, not `price`: `price` is the asking rate on every day, booked or not.
      - Occupancy rate is the average of `is_occupied` over days.
      - July 2021 and July 2022 are partial months, so their totals are not comparable with full months.
      - Listing 276450 has calendar and amenities data but no listings row, so its name and neighborhood are null.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - listing_id
              - listing_date
    columns:
      - name: listing_id
        description: "{{ doc('listing_id') }}"
        data_tests:
          - not_null
      - name: listing_name
        description: "{{ doc('listing_name') }}"
      - name: neighborhood
        description: "{{ doc('neighborhood') }}"
      - name: is_occupied
        description: "{{ doc('is_occupied') }}"
      - name: minimum_nights
        description: "{{ doc('minimum_nights') }}"
      - name: maximum_nights
        description: "{{ doc('maximum_nights') }}"
      - name: amenities
        description: "{{ doc('fact_amenities') }}"
      - name: price
        description: "{{ doc('calendar_price') }}"
      - name: revenue
        description: "{{ doc('calendar_revenue') }}"
      - name: listing_date
        description: "{{ doc('listing_date') }}"
        data_tests:
          - not_null

  - name: dim_listings
    description: |
      One row per listing with its current attributes and current amenities. Useful for quick lookups,
      such as which listings currently offer a given amenity, or a listing's host and neighborhood.

      Use with care:
      - Amenities here are the current ones. For anything over time (revenue, occupancy, prices),
        use fact_listings, which has the amenities as of each day.
    columns:
      - name: listing_id
        description: "{{ doc('listings_listing_id') }}"
        data_tests:
          - unique
          - not_null
      - name: listing_name
        description: "{{ doc('listing_name') }}"
      - name: host_id
        description: "{{ doc('host_id') }}"
      - name: host_name
        description: "{{ doc('host_name') }}"
      - name: host_since
        description: "{{ doc('host_since') }}"
      - name: host_location
        description: "{{ doc('host_location') }}"
      - name: host_verifications
        description: "{{ doc('host_verifications') }}"
      - name: neighborhood
        description: "{{ doc('neighborhood') }}"
      - name: property_type
        description: "{{ doc('property_type') }}"
      - name: room_type
        description: "{{ doc('room_type') }}"
      - name: accommodates
        description: "{{ doc('accommodates') }}"
      - name: bathrooms_text
        description: "{{ doc('bathrooms_text') }}"
      - name: bedrooms
        description: "{{ doc('bedrooms') }}"
      - name: beds
        description: "{{ doc('beds') }}"
      - name: amenities
        description: "{{ doc('dim_current_amenities') }}"
      - name: listing_price
        description: "{{ doc('listing_price') }}"
      - name: number_of_reviews
        description: "{{ doc('number_of_reviews') }}"
      - name: first_review
        description: "{{ doc('first_review') }}"
      - name: last_review
        description: "{{ doc('last_review') }}"
      - name: review_scores_rating
        description: "{{ doc('review_scores_rating') }}"
